<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f0">
  <meta name="description" content="Особенный сюрприз для учителя">
  <title>Ваш подарок 🎁</title>
  <link rel="preload" href="./monkey-prank.png" as="image">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 22px;
      overflow-x: hidden;
      color: #27304a;
      background:
        radial-gradient(circle at 8% 10%, #ffe3b9 0, transparent 32%),
        radial-gradient(circle at 94% 17%, #ffd8e7 0, transparent 35%),
        radial-gradient(circle at 50% 98%, #d4efff 0, transparent 42%),
        #fff9f3;
      transition: background-color 400ms ease;
    }

    .panel {
      width: min(100%, 520px);
      min-height: 425px;
      padding: clamp(28px, 7vw, 50px) 26px;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 32px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 24px 75px rgba(73, 56, 72, .12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: grid;
      place-items: center;
      transition: opacity 350ms ease, transform 350ms ease;
    }

    .stage { width: 100%; text-align: center; }
    .stage[hidden] { display: none !important; }

    .eyebrow {
      color: #ac6d38;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .gift-icon {
      font-size: clamp(76px, 17vw, 108px);
      line-height: 1.1;
      animation: float 2.5s ease-in-out infinite;
      margin: 0 auto 22px;
      display: block;
    }

    .title {
      margin: 0;
      color: #20294a;
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 850;
      letter-spacing: -.035em;
      line-height: 1.15;
    }

    .subtitle {
      margin: 16px 0 0;
      font-size: clamp(16px, 4vw, 19px);
      color: #667084;
      line-height: 1.55;
    }

    .progress {
      margin: 30px auto 0;
      height: 8px;
      width: min(100%, 265px);
      background: #f5e8de;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 100%;
      border-radius: inherit;
      transform-origin: left;
      background: linear-gradient(90deg, #ffb46c, #ff6985);
      animation: loading 2.7s ease-in-out both;
    }
    .stage-appear { animation: reveal 550ms both; }

    .confetti {
      position: relative;
      display: block;
      font-size: clamp(76px, 17vw, 108px);
      line-height: 1.1;
      margin: 0 auto 22px;
      animation: pop 600ms cubic-bezier(.25, 1.8, .5, 1) both;
    }

    .reward { color: #e95b80; }

    .final-view {
      position: fixed;
      inset: 0;
      z-index: 2;
      padding: 0;
      display: grid;
      place-items: center;
      background: #0f1521;
      opacity: 0;
      pointer-events: none;
      transition: opacity 480ms ease;
    }

    .final-view[hidden] { display: none !important; }
    body.finished { padding: 0; }
    body.finished .panel { opacity: 0; pointer-events: none; }
    body.finished .final-view { opacity: 1; pointer-events: auto; }

    .final-view img {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes loading {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { transform: scale(.75) rotate(-12deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="panel" id="panel">
    <section class="stage stage-appear" id="loading" aria-live="polite">
      <div class="eyebrow">Специально для учителей</div>
      <span class="gift-icon" aria-hidden="true">🎁</span>
      <h1 class="title">Проверяем ваш подарок…</h1>
      <p class="subtitle">Пожалуйста, подождите.<br>Подбираем для вас особенный сюрприз!</p>
      <div class="progress" aria-hidden="true"><span></span></div>
    </section>

    <section class="stage" id="congratulations" hidden aria-live="polite">
      <div class="eyebrow">Отличные новости!</div>
      <span class="confetti" aria-hidden="true">🎉</span>
      <h1 class="title">Поздравляем!</h1>
      <p class="subtitle"><strong class="reward">Вы получили подарок!</strong><br>Сейчас откроем его…</p>
    </section>
  </main>

  <section class="final-view" id="prank" hidden aria-label="Ваш подарок">
    <img src="./monkey-prank.png" alt="Чего ждёшь? Подарка? Иди работать!">
  </section>

  <script>
    (() => {
      const loading = document.getElementById('loading');
      const congratulations = document.getElementById('congratulations');
      const prank = document.getElementById('prank');
      const prankImage = prank.querySelector('img');

      // При повторном открытии страницы анимация запускается заново.
      window.setTimeout(() => {
        loading.hidden = true;
        congratulations.hidden = false;
        congratulations.classList.add('stage-appear');
      }, 2800);

      window.setTimeout(() => {
        // Если картинка не загрузилась, не оставляем посетителя на пустом экране.
        if (!prankImage.complete || prankImage.naturalWidth === 0) {
          congratulations.querySelector('.subtitle').textContent =
            'Не удалось открыть картинку. Обновите страницу и попробуйте ещё раз.';
          return;
        }

        prank.hidden = false;
        window.requestAnimationFrame(() => {
          document.body.classList.add('finished');
        });
      }, 5600);
    })();
  </script>
</body>
</html>
